name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint tools
        run: pip install ruff==0.14.14 mypy
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Type check
        run: mypy .
      - name: Byte-compile sources
        run: python -m compileall -q .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal test deps
        # Deliberately NOT `-r requirements.txt`: pulling llama-index/streamlit/
        # ollama/sentence-transformers would be slow. qdrant-client is light
        # (no ML framework) and runs fully local/embedded, so it's cheap to add;
        # retrieve.py tests inject a stub embedder instead of sentence-transformers.
        run: pip install pytest PyMuPDF qdrant-client
      - name: Run tests
        run: pytest -q
